type = "story"
title = "AI-assisted authoring (synthetic-first, live gated)"
description = "Instructor topic/requirements/teaching-content requests generate draft mini-courses and AI customize/refine existing drafts through epic-1's versioned processor configuration and consent/dispatch/accounting ports plus epic-2's generation contracts, re-gated for the changed instructor-authoring purpose (AD-10 — no blanket inherited eligibility or consent); generated drafts land in the authoring substrate as unapproved revisions feeding entry 3's inspector; declined consent preserves full manual authoring; no roster or learner identifier enters any dispatch payload. Synthetic deterministic fixtures drive the pipeline; live generation waits for eligibility evidence."
verify = "With synthetic fixtures, a topic/requirements request yields a versioned draft the instructor can edit and approve through the normal path, with consent refusal, quota/timeout and stale-conflict honesty by 120 seconds and one tracked result per command; declined consent performs zero external calls and leaves manual authoring untouched; no dispatch payload contains roster or learner-identifier data; live acceptance stays blocked per the unknown."
covers = ["R1"]
after = [2, "2.1", "1.3", "1.6"]
hitl = false
risk = "high"
unknown = "Live provider eligibility for the instructor-authoring purpose is unverified: a D5-compatible provider/model/endpoint with retention/deletion/non-training/location proof and operator authorization for synthetic non-personal tests (the epic-1 S6 / epic-2 F-A blocker, re-gated for this purpose). Synthetic-fixture development proceeds; live dispatch and live acceptance stay blocked."
references = ["architecture — _bmad-output/initiative-ai-learning-platform/architecture-shared-technical/architecture-shared-technical.md, AD-10 policy-enforced provider boundary", "policy — _bmad-output/initiative-ai-learning-platform/product-policies.md, D5 processing minimization"]

