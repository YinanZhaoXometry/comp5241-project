# covers uses THIS epic's R1-R4 (parent R3/R4/R5/R16), not initiative R ids.
# Entry `after` pins stage the four earlier epics per provider: numeric "1.<id>"/"2.x" for
# built/refined epic-1/2 entries; sibling pins repointed 2026-10-24 to epic-2 generation
# 2.1, player 2.3, provenance 2.7 and why 2.6; epic-3 scoring 3.3/retest chain 3.2/handoff
# 3.8; epic-4 scoped due-state/cancellation 4.6. 2026-10-29: the epic file's whole-epic
# `after` was narrowed by owner replan to epics 1-2 (closed); the epic-3/4 needs are
# carried by the entry pins (contract-level). Entry 1 started under the owner's go.
