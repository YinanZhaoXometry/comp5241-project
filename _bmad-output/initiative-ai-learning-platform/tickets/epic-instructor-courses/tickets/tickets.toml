next_id = 13

[[entry]]
id = 1
type = "story"
title = "Manual-course approval-enrollment tracer"
description = "The thinnest full path through every layer this epic touches: on the operator-provisioned synthetic instructor principal, create one course, draft one mini-course version manually (one lesson with one required content item — no AI, no tests), approve that exact version with approver/time/version recorded, owner-enroll one verified learner through a single-row preview/confirm action (CSV import is entry 4), and port the static /instructor/courses and /instructor/approvals references to live instructor-shell routes with the honesty label preserved. The learner studies through the learner shell, never the instructor studio. Human step: the operator provisions/confirms the synthetic instructor principal and grants the explicit start authorization for instructor-course work."
verify = "After a web/worker restart the instructor reopens the course with the approved version immutable; the enrolled learner studies the approved lesson and can see no other version or draft; a non-enrolled learner, a second instructor and an ordinary admin all receive the same no-existence-leak denial; duplicate approve/enroll commands yield exactly one receipt each; the tracer's course/enrollment records register in the epic-1 lifecycle inventory."
covers = ["R1", "R2", "R3"]
after = ["1.1", "2.3"]
hitl = true
risk = "high"
references = ["UX — _bmad-output/initiative-ai-learning-platform/ux-ai-learning-platform/EXPERIENCE.md, Information Architecture (instructor shell) and Component Patterns (Approval inspector)", "policy — _bmad-output/initiative-ai-learning-platform/product-policies.md, D4 approval unit and D5 enrollment"]

[[entry]]
id = 2
type = "story"
title = "Versioned authoring and teaching-material substrate"
description = "Expand the tracer's single-version draft into the authoring substrate: course/mini-course/lesson/content-item/activity editing with immutable revisions and dependency identity (AD-5), required/optional and required-outcome declarations, pass-mark configuration consumed from epic-3 policy contracts, draft-versus-published separation, and course-scoped teaching-material upload through the bounded four-format extraction contract (epic-1 S2) — course-owned material never becomes a personal upload and vice versa. AI-assisted generation is entry 6; this entry is manual."
verify = "Iterative edits create new revisions while the published release stays pinned; a dependency edit marks affected drafts as needing reapproval rather than silently changing published content; a course-scoped upload extracts under the same limits/preview honesty and is invisible to learners until approved; cross-scope material reads are denied; keyboard-only authoring works at 360px and desktop."
covers = ["R1"]
after = [1, "1.2", "2.7"]
hitl = false
risk = "high"
references = ["architecture — _bmad-output/initiative-ai-learning-platform/architecture-shared-technical/architecture-shared-technical.md, AD-5 immutable publication and dependency identity", "PRD — _bmad-output/initiative-ai-learning-platform/prd-ai-learning-platform/prd-ai-learning-platform.md, FR-3 consequences"]

[[entry]]
id = 3
type = "story"
title = "Exact-version approval inspector, invalidation and withdrawal"
description = "Build the spine's approval inspector on the authoring substrate: side-by-side exact-version inspection of lessons, supplementary sources and question/answer/rubric/feedback bundles with the keyboard-operable \"I have inspected these exact versions\" gate enabling Approve; approver/time/version records; batch approval only over listed inspected versions; dependency-edit invalidation of affected draft approvals; withdrawal of an erroneous published item blocks new use immediately, identifies affected evidence and routes correction through epic-3's D3 process without revoking earned passes or rewriting past attempts."
verify = "An unapproved or stale-draft version is invisible to enrolled learners, who get the honest \"Pending instructor approval\" state; editing a rubric invalidates the dependent approval while the published release and pinned attempts stay intact; withdrawal stops new use at once, a previously earned pass remains and only pending decisions pause; approval records name approver, time and versions; batch approval cannot cover uninspected versions."
covers = ["R3"]
after = [2]
hitl = false
risk = "high"
references = ["UX — _bmad-output/initiative-ai-learning-platform/ux-ai-learning-platform/EXPERIENCE.md, Component Patterns (Approval inspector) and State Patterns (Pending approval)", "policy — _bmad-output/initiative-ai-learning-platform/product-policies.md, D4 approval unit, dynamic content and changes"]

[[entry]]
id = 4
type = "story"
title = "CSV roster preview/confirm import and verified invitations"
description = "UTF-8 name-and-email CSV import with row-level preview before any commit: normalized row errors (malformed email, missing name, oversize), duplicate detection within the file and against existing enrollment, honest summary and explicit confirmation; invite records for emails without accounts; server-side association only with verified accounts whose email matches — never by client assertion (AD-14); no imported passwords or grades; the roster appears in no learner-visible surface and no provider payload; re-importing an enrolled learner creates no duplicate enrollment."
verify = "A fixture roster with duplicates, malformed rows and new/known emails previews every error before confirmation and enrolls exactly the confirmed verified matches once the operator provisions matching accounts; an unverified or wrong-email account is denied course access; the roster is absent from learner surfaces and dispatch payloads; duplicate confirm yields one enrollment per learner; preview/confirm and row focus behavior follow the spine's interaction primitives."
covers = ["R2"]
after = [1]
hitl = false
risk = "high"
unknown = "Real verified-account invitation delivery (email tokens or account creation for people without operator-provisioned accounts) has no product surface under D6's in-app-only rule and no authorization; synthetic association with operator-provisioned verified accounts proceeds, but any real-invitation path stays blocked until mechanics are chosen, evidenced and authorized."
references = ["UX — _bmad-output/initiative-ai-learning-platform/ux-ai-learning-platform/EXPERIENCE.md, Component Patterns (CSV import preview)", "architecture — _bmad-output/initiative-ai-learning-platform/architecture-shared-technical/architecture-shared-technical.md, AD-14 roster rules"]

[[entry]]
id = 5
type = "story"
title = "Enrollment revocation and immediate reminder cancellation"
description = "Owner-side enrollment management over the confirmed roster: remove learners after explicit confirmation; removal immediately ends future course-content access and cancels that course's reminders through epic-4's course-scoped cancellation contract (authorization-epoch rechecks on reads, jobs and delivery); a removed verified learner retains only a distinct self-history export of their own progress/scores through epic-1 export classes — no question bank, roster or other learners; revocation never silently deletes the instructor's legitimate course records; deletion/revocation races follow AD-4 fences."
verify = "After removal, the former learner's next request, queued job and reminder delivery are denied or canceled with no late output recommitting; the self-history export contains only their own progress/scores; the instructor's course records and other learners are untouched; a race between removal and an in-flight attempt yields denial without duplicate effects; course-enrollment derivatives are registered in the lifecycle inventory."
covers = ["R2"]
after = [4, "4.6", "3.8", "1.8", "1.9"]
hitl = false
risk = "high"
references = ["architecture — _bmad-output/initiative-ai-learning-platform/architecture-shared-technical/architecture-shared-technical.md, AD-3 post-removal actions, AD-4 fences and AD-13 delivery rechecks", "policy — _bmad-output/initiative-ai-learning-platform/product-policies.md, D5 enrollment and owner controls"]

[[entry]]
