[[entry]]
id = 1
type = "story"
title = "Confirmed-plan-to-generated-course tracer"
description = "Consume epic 1's authorized exact-revision confirmed-plan handoff and versioned processor configuration/dispatch/accounting ports to generate one source-linked mini-course — one lesson with per-section source locations and an AI-generated/unreviewed label plus one recall item — persisted as versioned course/objective/source lineage. Local synthetic processor fixtures drive the pipeline by default; live dispatch waits for F-A evidence. No supplementation, adaptation variants or full player."
verify = "With two test accounts, A's confirmed plan yields a generated course A can open and study: the lesson shows source locations and the unreviewed label, the recall item withholds its answer until submission, B and stale/unconfirmed/deleted-plan requests get honest denial, and generation jobs survive web/worker restart with one tracked result per command."
covers = ["R1", "R5"]
after = ["1.3", "1.5", "1.6"]
hitl = true
risk = "high"
references = ["story contract — _bmad-output/initiative-ai-learning-platform/tickets/epic-grounded-mini-courses/delivery-checks.md, S1 and F-A", "UX — _bmad-output/initiative-ai-learning-platform/ux-ai-learning-platform/EXPERIENCE.md, Component Patterns and State Patterns"]

[[entry]]
id = 2
type = "story"
title = "Bounded source retrieval and attributed supplementation"
description = "Introduce the epic's bounded authoritative-source retrieval path under the architecture's fetch-boundary rules (AD-11: allowlisted public-source fetch adapter, DNS/IP-bound validation, redirect revalidation, private/loopback/metadata-network and non-HTTPS/oversize denial, identity/passage/time/hash records) with per-source identity/location, a supplement badge distinguishing supplements from the learner's uploads, side-by-side conflict display and unsupported-answer stopping without silent replacement or scored items. AI-proposed citations are never verification; every supplement is checked against its fetched source. Live fetch waits for F-B; fixture development proceeds without egress."
verify = "A plan whose material lacks a needed explanation receives an attributed supplement with a reachable source location; a conflicting claim renders both sources side by side; an unverifiable claim stops with an honest unsupported state and no scored item; fetch failures are honest and retryable; zero fetch happens without its authorized bounded configuration and no fetch reaches a private, loopback or metadata address."
covers = ["R2"]
after = [1]
hitl = false
risk = "high"
references = ["story contract — _bmad-output/initiative-ai-learning-platform/tickets/epic-grounded-mini-courses/delivery-checks.md, S2 and F-B", "UX — _bmad-output/initiative-ai-learning-platform/ux-ai-learning-platform/EXPERIENCE.md, State Patterns"]

