# Ordered subject-and-activity-breadth stories, 2026-10-24; no leaf files or execution plans yet.
# covers uses THIS epic's R1-R12 (parents R9/R17/R18/R19), not initiative R ids.
# One lane protects the shared AD-12 activity contract, evidence mapping and media
# surfaces; 2026-10-29: the whole-epic gate was narrowed by owner replan to epic 2
# (closed), with the epic-3/5 needs carried by the entry pins. Entry 2 (G4 spike)
# started under the owner's go; every other entry chains through entry 1 -> 3.8.
# Cross-epic pins are numeric "<epic>.<entry>" into the refined siblings' tomls
# (2.4/2.7, 3.8, 5.2/5.3); epic 1 is reached transitively and never pinned directly.
# unknown gates the start; hitl identifies actual human work but is not a readiness gate.
next_id = 15

[[entry]]
id = 1
type = "story"
title = "Breadth tracer: soft-skills simulation through the existing player"
description = "The thinnest full path through every layer this epic touches: define the AD-12 versioned discriminated activity contract (objective revisions, required/optional, scored/unscored, input/output schema, accessibility equivalent, evidence mapping) over epic 2's versioned provenance surface and epic 3's activity/rubric/completion handoff, implement one functioning interactive-simulation renderer inside the existing lesson shell and content-item tracker, and wire one required simulation activity into a soft/product-skills representative mini-course on an original synthetic fixture — explicit submission, typed activity-submission evidence per AD-7, required-item completion contribution per D1/AD-8 (never a direct pass), and lifecycle registration of the activity and its derivatives. No other family, media machinery or provider work in this entry. Human step: the operator's explicit start authorization for epic-6 work; the entry has no other manual procedure."
verify = "With two local test accounts, A opens the soft-skills course in the existing player, works the simulation to two distinct outcomes, submits once, sees the content-item tracker mark the activity done and the roadmap node advance under the required-activity contract; B and stale/deleted-root requests get honest denial; the activity, evidence and derivatives survive web/worker restart and register in the lifecycle inventory."
covers = ["R3", "R5"]
after = ["2.7", "3.8"]
hitl = true
risk = "high"
unknown = "Start authorization: the whole-epic gate was narrowed to contract-level handoffs on 2026-10-29 and only entry 2 (the G4 spike) was started; this tracer still waits on 3.8 through its `after` pin and takes its own owner go at that turn, as 3.1/3.2 did — no start authorization exists for it yet."
references = ["architecture — _bmad-output/initiative-ai-learning-platform/architecture-shared-technical/architecture-shared-technical.md, AD-12 activity contract", "UX — _bmad-output/initiative-ai-learning-platform/ux-ai-learning-platform/EXPERIENCE.md, Component Patterns (activity-family shells, content-item tracker) and State Patterns"]

[[entry]]
id = 2
type = "spike"
title = "G4 feasibility spike: isolated code runner and offline narration"
description = "Answer the two questions only code can answer, before any activation. (a) Isolated code execution: stand up a spike harness for a dedicated per-job no-network sandbox runner — never the web/worker process, eval or Node vm — with enforced CPU/wall-time/memory/process/disk/output/concurrency limits, ephemeral filesystem destroyed after completion and host-level egress denying DNS/metadata, and run malicious-code, resource-exhaustion, escape and cleanup probes. (b) Offline narration: evaluate offline engine/voice candidates against license terms, resource cost and quality with recorded findings. Produce admission-grade dossiers following the parser-container admission precedent (fail-closed, quarantine on doubt); select and activate nothing."
verify = "The recorded dossiers in the epic folder name every probe result (escape/egress/limits/cleanup) and the narration engine/voice license findings with sources; no product code path is activated and no provider is named as selected; the narrated-slides and online-coding entries cite these dossiers as their admission input."
covers = ["R8", "R9"]
after = []
hitl = false
risk = "high"
references = ["architecture — _bmad-output/initiative-ai-learning-platform/architecture-shared-technical/architecture-shared-technical.md, AD-12 isolation rules and gate G4", "precedent — docs/bounded-document-extraction.md, fail-closed sandbox admission with quarantine on doubt"]

