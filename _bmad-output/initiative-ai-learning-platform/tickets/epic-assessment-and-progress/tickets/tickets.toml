[[entry]]
id = 1
type = "story"
title = "Plan-to-roadmap scored-attempt tracer"
description = "With the authorized starter, consume epic 1's persisted confirmed plan and owner/session boundary and epic 2's versioned course/objective provenance surface (entry 2.7) to run the thinnest assessment path: present one required objective-linked test from a manually checked synthetic fixture bank, start one attempt that snapshots its blueprint, questions, rubric, point scale and applicable 80%-default mark, submit it, score it deterministically with unrounded scaled-integer comparison, and reflect the resulting roadmap node state (In progress on required-item/test gaps, Completed when the thin required set is done and passed). Establish the assessment/progress module, its migration ownership under AD-1/AD-17 and purpose-typed attempt evidence per AD-7; no recovery, partial credit, guidance or parent awards in this entry."
verify = "Using two local test accounts on synthetic fixtures, A opens the generated course's required test, sees threshold/available points/scoring criteria before starting, submits one attempt that scores honestly at a boundary fixture (e.g. 79.96% vs 80% reads Not passed), and the course node shows In progress, then Completed on a passing rerun; B and stale/deleted-course requests get scope denial; the attempt and its snapshot survive web/worker restart with one tracked result per submit command."
covers = ["R2", "R4"]
after = ["1.1", "1.5", "2.7"]
hitl = true
risk = "high"
unknown = "Starting awaits the owner's explicit build authorization for epic 3 (none given as of 2026-10-28; this planning authorizes nothing). The 2026-10-21 whole-epic gate part is settled — epic 1 closed 2026-10-25 (1.6/1.7/1.12 done, 1.14 dropped-deferred) and epic 2 closed 2026-10-28 (2.1–2.10 done, 2.11 dropped-deferred) — and this entry's cross-epic after (1.1, 1.5, 2.7) is done. Live-eligibility unknowns on later entries (F-A pattern, 3.2/3.5) are separate and stand."
references = ["UX — _bmad-output/initiative-ai-learning-platform/ux-ai-learning-platform/EXPERIENCE.md, Test attempt view pattern and State Patterns (Pass-mark boundary)", "PRD — _bmad-output/initiative-ai-learning-platform/prd-ai-learning-platform/prd-ai-learning-platform.md, FR-13 consequences"]

[[entry]]
id = 2
type = "story"
title = "Targeted recovery ledger and fresh retest chain"
description = "Build the epic's riskiest surface per AD-8: on a failed ordinary attempt, compute initial objective-group results under the same snapshot, preserve passing groups, and ledger every failed group as an open recovery target; offer focused review per group, then a fresh retest declaring target groups at the same intended cognitive demand with comparable rubric/points coverage, drawn from a manually checked synthetic fixture retest bank. Each reassessed group must reach the root attempt's applicable threshold to clear; uncleared or untested targets keep the failed-test requirement unsatisfied; the original score is never rewritten and recovery credit shows separately; root policy stays fixed through the recovery chain. Tests cover success, failure and partial-target coverage with retained passes."
verify = "A failed fixture attempt at 68% opens recovery for exactly its failed groups; a retest clearing one group and not the other leaves the requirement honestly open with original 68% and per-group credit shown side by side; a later retest clearing the remainder satisfies the requirement without repeating passed sections or altering the original score; duplicate retest commands yield one tracked attempt each."
covers = ["R3"]
after = [1, "1.3", "1.6"]
hitl = false
risk = "high"
unknown = "F-A-pattern live retest eligibility: AI generation of fresh same-demand retest variants needs a purpose-re-gated D5-compatible provider (retention/deletion/non-training proof plus operator authorization for synthetic non-personal tests), the same blocker as epic 1 S6/epic 2 F-A. Synthetic checked fixture banks proceed; live generation and its live acceptance stay blocked."
references = ["UX — _bmad-output/initiative-ai-learning-platform/ux-ai-learning-platform/EXPERIENCE.md, Recovery path pattern and State Patterns (Partial recovery)", "PRD — _bmad-output/initiative-ai-learning-platform/prd-ai-learning-platform/prd-ai-learning-platform.md, FR-14 consequences"]

[[entry]]
id = 3
type = "story"
title = "Snapshotted scoring surface and pass-mark boundaries"
description = "Complete the D3/AD-8 scoring surface around the tracer's thin path: nonnegative scaled-integer points with exact rational threshold cross-products (no floating-point/display rounding deciding a pass), one-decimal display plus authoritative Pass/Not passed, disclosed partial credit only under a declared finite-precision rubric with no negative marking, invalid/zero-total rubrics rejected, instructor pass-mark override carried as an attempt-snapshotted contract for epic 5, pre-start disclosure of threshold/points/criteria, visible previous attempts never silently overwritten, duplicate submission one receipt, and mid-attempt threshold/rubric edits affecting only new attempts. Type the provisional-grade state (cannot award completion while pending) as the contract epic 5 confirms."
verify = "Boundary fixtures at 79.96%/80.00%/80.04% against an 80% mark return Not passed/Pass/Pass with one-decimal display and explicit status; a partial-credit rubric item scores per its disclosure; a policy edit mid-attempt leaves the running attempt's snapshot fixed while the next attempt uses the new policy; repeated submits of one attempt commit exactly one result."
covers = ["R2"]
after = [1]
hitl = false
risk = "high"
references = ["policy — _bmad-output/initiative-ai-learning-platform/product-policies.md, D3 scoring/threshold/snapshot checks", "architecture — _bmad-output/initiative-ai-learning-platform/architecture-shared-technical/architecture-shared-technical.md, AD-8 scoring rules"]

[[entry]]
id = 4
type = "story"
title = "Content-plus-tests completion and monotonic parent awards"
description = "Assemble completion per AD-5/AD-8: required content-item done records and required non-test activity submissions (consumed from epic 2's tracker under the shared evidence contract) plus every required test ordinarily passed or fully recovered award a unique version-scoped, monotonic mini-course completion; a parent path/course evaluates its required-child manifest and awards parent completion only when every required child release is awarded, optional children never blocking. Version switching is an explicit informed choice with changed required work shown before switching; new drafts or optional additions never erase prior awards; later review outcomes and policy edits never revoke earned completion. Tests cover every D1 completion-check case including parent-with-incomplete-child."
verify = "A course with all required items done but one failed/unrecovered test stays In progress; satisfying the last requirement through normal passing and through full targeted recovery both award completion exactly once; a parent with one incomplete required child stays incomplete while an optional child does not block; superseding the course revision or a later policy edit leaves the earned award intact, and explicit version switching discloses changed required work first."
covers = ["R2", "R4"]
after = [1, 2, 3, "2.3"]
hitl = false
risk = "high"
references = ["policy — _bmad-output/initiative-ai-learning-platform/product-policies.md, D1 content finished/tests separate/version scope", "architecture — _bmad-output/initiative-ai-learning-platform/architecture-shared-technical/architecture-shared-technical.md, AD-5 parent manifests and AD-8 monotonic awards"]

[[entry]]
id = 5
type = "story"
title = "Evidence-linked gap guidance with Unknown separation"
description = "Build R10's guidance on typed evidence only: recommendations name the still-failed or partially-recovered objective groups and practice evidence they draw on, cite the specific response/objective, explain uncertainty, and link to focused review; Unknown (unassessed objectives) renders distinctly from Needs practice (observed difficulty, cause unnamed); assisted practice, unaided performance, self-report and engagement stay labeled and never merge; the learner can flag an unclear question from the result/guidance surface (feeding entry 7). Deterministic guidance over fixtures is the acceptance core; AI-narrated personalized guidance is a live-gated enhancement behind the provider gate."
verify = "After a failed attempt and mixed practice, guidance lists exactly the failed groups with their cited responses, marks an unassessed objective Unknown rather than Needs practice, labels assisted practice separately from the unaided attempt, and never asserts a cause or mastery; flagging a question records the flag without altering scores."
covers = ["R1"]
after = [2, 3, "2.5", "1.3", "1.6"]
hitl = false
risk = "high"
unknown = "F-A-pattern live guidance eligibility: AI-narrated personalized gap guidance needs a purpose-re-gated D5-compatible provider with the epic-1 S6/epic-2 F-A evidence and operator authorization for synthetic non-personal tests. Deterministic fixture-based guidance proceeds; live dispatch and its live acceptance stay blocked."
references = ["policy — _bmad-output/initiative-ai-learning-platform/product-policies.md, D2 gap guidance and evidence separation", "UX — _bmad-output/initiative-ai-learning-platform/ux-ai-learning-platform/EXPERIENCE.md, Voice and Tone (Needs practice, honest uncertainty) and Flow 2"]

