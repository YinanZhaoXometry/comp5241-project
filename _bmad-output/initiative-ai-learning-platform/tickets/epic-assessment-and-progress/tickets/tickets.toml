[[entry]]
id = 7
type = "story"
title = "Disputed-item correction and honest retries"
description = "Implement D3's quality/correction and retry honesty: a flagged scored item enters Under review; if its validity could affect a pending or unearned completion decision, that decision pauses while prior evidence is retained and a corrected/replacement assessment is offered without counting the dispute as another failure; already-earned passes and completion are never revoked — history preserved, defect annotated. Retries have no pedagogical limit; service/quota delays present a clear message with saved work and never record a failed attempt or promise unlimited free generation."
verify = "Flagging a borderline fixture item marks it Under review and pauses only the affected pending completion; a corrected replacement satisfies the requirement without an extra failed attempt; a previously earned pass on the disputed item stands; exhausting a generation quota yields an honest delay message with saved work and zero attempt records; unlimited pedagogical retries hold across the chain."
covers = ["R3"]
after = [2, 5]
hitl = false
risk = "medium"
references = ["policy — _bmad-output/initiative-ai-learning-platform/product-policies.md, D3 retries and quality/correction", "UX — _bmad-output/initiative-ai-learning-platform/ux-ai-learning-platform/EXPERIENCE.md, State Patterns (Item under review)"]

