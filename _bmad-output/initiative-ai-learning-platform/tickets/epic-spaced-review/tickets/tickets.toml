[[entry]]
id = 9
type = "story"
title = "Integrated review suite and authorized release verification"
description = "Close the return journey with integrated checks across the Done-when paths: completion → first review → adaptive intervals across a time gap (controlled clock), consolidated reminders under timezone change, every control, overdue aggregation, preserved completion, scoped-contract denial and deletion/restore cancellation — plus an actual return smoke check on the authorized deployment. The real seven-day pilot observation remains a later initiative-closure check under D8, never fabricated elapsed time. A blocked release cannot be recorded Done."
